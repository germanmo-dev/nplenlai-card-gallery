<!doctype html>
<html lang="en">
  <head>
    <!-- Connect -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Npenlai</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon/favicon-16x16.png"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <header class="header">
      <a href="" class="logo">Npenlai</a>
      <!-- Search -->
      <form class="search">
        <input
          name="q"
          type="search"
          class="search-input"
          placeholder="Search..."
        />
        <button type="submit" class="search-btn">Search</button>
      </form>
      <!-- Elements -->
      <nav class="nav">
        <button class="theme-btn my-btn">Theme</button>
        <a href="#">Random</a>
        <a href="#">Tags</a>
        <a href="#">Authors</a>
        <a href="#">Favorites</a>
      </nav>
    </header>
    <!-- Popular Section -->
    <main class="main">
      <section class="section">
        <h2 class="section-title">Popular Now</h2>
        <div class="grid">
          <article class="card">
            <img src="pics/1.jpg" alt="Morning in the City" loading="lazy" />
            <h3>Morning in the City</h3>
          </article>

          <article class="card">
            <img src="pics/2.jpg" alt="Foggy Forest" loading="lazy" />
            <h3>Foggy Forest</h3>
          </article>

          <article class="card">
            <img src="pics/3.jpg" alt="Rainy Street" loading="lazy" />
            <h3>Rainy Street</h3>
          </article>

          <article class="card">
            <img src="pics/4.jpg" alt="Lake at Sunset" loading="lazy" />
            <h3>Lake at Sunset</h3>
          </article>

          <article class="card">
            <img src="pics/5.jpg" alt="Neon Night" loading="lazy" />
            <h3>Neon Night</h3>
          </article>
        </div>
      </section>
      <!-- New Uploads -->
      <section class="section">
        <h2 class="section-title">New Uploads</h2>
        <div class="grid">
          <article class="card">
            <img src="pics/6.jpg" alt="Mountain Peak" loading="lazy" />
            <h3>Mountain Peak</h3>
          </article>

          <article class="card">
            <img src="pics/7.jpg" alt="Old Bridge" loading="lazy" />
            <h3>Old Bridge</h3>
          </article>

          <article class="card">
            <img src="pics/8.jpg" alt="Autumn Park" loading="lazy" />
            <h3>Autumn Park</h3>
          </article>

          <article class="card">
            <img src="pics/9.jpg" alt="Sea Waves" loading="lazy" />
            <h3>Sea Waves</h3>
          </article>

          <article class="card">
            <img src="pics/10.jpg" alt="Snowy Road" loading="lazy" />
            <h3>Snowy Road</h3>
          </article>
        </div>
      </section>
    </main>
    <!-- Footer -->
    <footer class="footer">
      <small>© 2026 Npenlai</small>
    </footer>
    <a href="#" class="to-top">↑</a>
    <script src="script.js"></script>
  </body>
</html>
